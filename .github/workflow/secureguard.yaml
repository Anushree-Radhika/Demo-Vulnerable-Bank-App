name: SecureGuard Security Scan
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install OSV-Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: Run CVE Scan
        run: ./osv-scanner --recursive . --format json > osv.json || true

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Misconfiguration Scan
        run: semgrep --config=p/secrets --json . > sg.json || true

      - name: Block PR on critical CVEs
        run: |
          CRITICAL=$(cat osv.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          n=sum(1 for r in d.get('results',[]) for p in r.get('packages',[])
          for v in p.get('vulnerabilities',[])
          if v.get('database_specific',{}).get('severity')=='CRITICAL')
          print(n)")
          if [ $CRITICAL -gt 0 ]; then
            echo "BLOCKED: $CRITICAL critical CVEs found!"
            exit 1
          fi