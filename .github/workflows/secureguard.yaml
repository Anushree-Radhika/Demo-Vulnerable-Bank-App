name: SecureGuard Security Scan
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install OSV-Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: Generate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts || true

      - name: Run CVE Scan
        run: |
          ./osv-scanner --recursive . --format json > osv.json || true
          echo "OSV scan done"
          cat osv.json || echo "empty"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Misconfiguration Scan
        run: semgrep --config=p/secrets --json . > sg.json || true

      - name: Block on any vulnerability
        run: |
          python3 << 'EOF'
          import json, sys

          total = 0

          # Check OSV results
          try:
              with open("osv.json") as f:
                  data = json.load(f)
              for r in data.get("results", []):
                  for pkg in r.get("packages", []):
                      total += len(pkg.get("vulnerabilities", []))
          except Exception as e:
              print(f"OSV parse note: {e}")

          # Check Semgrep results
          try:
              with open("sg.json") as f:
                  data = json.load(f)
              total += len(data.get("results", []))
          except Exception as e:
              print(f"Semgrep parse note: {e}")

          print(f"Total vulnerabilities found: {total}")

          if total > 0:
              print("╔══════════════════════════════════════════╗")
              print("║   ❌  SECUREGUARD BLOCKED THIS PUSH      ║")
              print(f"║   {total} vulnerabilities detected!          ║")
              print("╚══════════════════════════════════════════╝")
              sys.exit(1)
          else:
              print("✅ No vulnerabilities found!")
          EOF